name: Update README Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: "!contains(github.event.head_commit.message, 'chore: update README version')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: version
        run: |
          VERSION=$(git tag --sort=-version:refname | head -n 1)

          if [ -z "$VERSION" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          sed -i '/^<!-- latest-version -->/d' README.md
          echo "" >> README.md
          echo "<!-- latest-version --> Latest Version: ${{ steps.version.outputs.version }}" >> README.md

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update README version"
            git push
          fi