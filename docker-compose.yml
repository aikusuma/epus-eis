version: '3.8'

services:
  # PostgreSQL - Operational & ACL database
  postgres:
    image: postgres:16-alpine
    container_name: epus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epus_user
      POSTGRES_PASSWORD: epus_password
      POSTGRES_DB: epus_eis
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epus_user -d epus_eis']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
